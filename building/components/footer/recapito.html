{{!-- Nome della scuola e telefono del contatto "generale" di data/contatti.json. --}}
<address class="footer-brand">
    <span class="footer-brand-name">{{brand.name}}</span>
    {{#with telefono}}

    <a href="tel:{{href}}" class="footer-phone" aria-label="Chiamaci al {{testo}}">
        <i class="fas fa-phone-alt" aria-hidden="true"></i>
        <span>{{testo}}</span>
    </a>
    {{/with}}
</address>
