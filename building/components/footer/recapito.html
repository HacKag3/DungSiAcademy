{{!--
    Nome della scuola e telefono del contatto "generale": il numero è letto a
    runtime da contenuti/contatti.json (js/main_comp/contatti.js) e il link
    resta nascosto se il numero manca.
--}}
<address class="footer-brand">
    <span class="footer-brand-name">{{brand.name}}</span>
    <a class="footer-phone" data-contatto-telefono="generale" data-aria="Chiamaci al" hidden>
        <i class="fas fa-phone-alt" aria-hidden="true"></i>
        <span data-campo="testo"></span>
    </a>
</address>
