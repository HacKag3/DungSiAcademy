{{!-- Anteprime per social e app di messaggistica (Open Graph e Twitter). --}}
<meta property="og:type" content="website">
<meta property="og:url" content="{{page.url}}">
<meta property="og:site_name" content="{{brand.name}}">
<meta property="og:locale" content="{{sito.locale}}">
<meta property="og:title" content="{{page.ogTitle}}">
<meta property="og:description" content="{{page.description}}">
<meta property="og:image" content="{{immagine}}">
<meta property="og:image:width" content="{{brand.copertina.width}}">
<meta property="og:image:height" content="{{brand.copertina.height}}">
<meta property="og:image:alt" content="{{brand.copertina.alt}}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{page.ogTitle}}">
<meta name="twitter:description" content="{{page.description}}">
<meta name="twitter:image" content="{{immagine}}">
