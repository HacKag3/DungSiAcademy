<!DOCTYPE html>
<html lang="it">

<head>
    {{HEAD_ERROR}}
</head>

<body class="error-document">
    <div class="bg-layer"></div>

    <main class="error-page" aria-labelledby="error-title">
        <div class="error-code" aria-hidden="true">{{ERROR_CODE}}</div>
        <p class="error-kicker">{{ERROR_KICKER}}</p>
        <h1 id="error-title">{{ERROR_TITLE}}</h1>
        <p class="error-description">{{ERROR_DESCRIPTION}}</p>
        <div class="error-actions">
            <a class="error-button error-button-primary" href="./index.html">
                <i class="fas fa-home" aria-hidden="true"></i>
                <span>Torna alla home</span>
            </a>
            <a class="error-button error-button-secondary" href="./contacts.html">
                <i class="fas fa-envelope" aria-hidden="true"></i>
                <span>Contattaci</span>
            </a>
        </div>
    </main>
</body>

</html>
