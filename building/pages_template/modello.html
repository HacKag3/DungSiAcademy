<!--
    Per creare una nuova pagina:
    1. Copia questo file in building/pages_template/nome-pagina.html e scrivi il contenuto in <article>.
    2. Aggiungi una voce in building/data/seo-data.json (sezione "pages") con:
         "key": "nome-pagina",
         "template": "nome-pagina.html",
         "output": "nome-pagina.html",
         "title": "Titolo Breve Pagina",
         "ogTitle": null,
         "description": "Descrizione di massimo ~155 caratteri."
    3. Esegui: npm run build
    4. Il file nome-pagina.html comparirà nella root, pronto per il deploy.
    5. Il sitemap viene aggiornato dal build usando building/seo/sitemap.xml.

    Il build integra a priori solo SEO, struttura della pagina e navigazione
    (iniettata come JSON in #navigation-data). Header, footer e contenuti
    (orari, contatti, sede, social, dati legali, team, annunci) sono caricati
    a runtime da data/*.json via js/data-loader.js: modificare un JSON
    aggiorna le pagine SENZA rebuild. Non esiste più js/config.js.
-->
<!DOCTYPE html>
<html lang="it">

<head>
    {{HEAD_PAGES}}

    <!-- Aggiungi js, css, etc. specifici -->
</head>

<body>
    <div class="bg-layer"></div>

    <header id="header"><!-- auto-generated a runtime --></header>

    <article id="page-content">
        <!-- contenuto pagina -->
    </article>

    <footer id="footer"><!-- auto-generated a runtime --></footer>

</body>

</html>
