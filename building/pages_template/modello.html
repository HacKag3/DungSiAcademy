         "key": "nome-pagina",
         "template": "nome-pagina.html",
         "output": "nome-pagina.html",
         "title": "Titolo Breve Pagina",
         "ogTitle": null,
         "description": "Descrizione di massimo ~155 caratteri."
    3. Esegui: npm run build:seo
    4. Il file nome-pagina.html comparirà nella root, pronto per il deploy.
    5. Aggiungi la pagina anche in sitemap.xml.
-->
